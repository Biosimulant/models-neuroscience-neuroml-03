      model_path: data/render_xml_file.nml
  layer_burst_2:
    class: src.layer_5_burst_irregular_nest_basket_cell_4_nmlcl000245_model:Layer5BurstIrregularNestBasketCell4Nmlcl000245Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_3:
    class: src.layer_5_burst_irregular_nest_basket_cell_5_nmlcl000246_model:Layer5BurstIrregularNestBasketCell5Nmlcl000246Model
    args:
      model_path: data/render_xml_file.nml
  state_compare_mon:
