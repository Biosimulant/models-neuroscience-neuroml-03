modules:
  layer_delayed_1:
    class: src.layer_4_delayed_stuttering_large_basket_cell_2_nmlcl001093_model:Layer4DelayedStutteringLargeBasketCell2Nmlcl001093Model
    args:
      model_path: data/render_xml_file.nml
  layer_delayed_2:
    class: src.layer_4_delayed_stuttering_large_basket_cell_3_nmlcl001094_model:Layer4DelayedStutteringLargeBasketCell3Nmlcl001094Model
    args:
      model_path: data/render_xml_file.nml
  state_compare_mon:
    class: src.state_comparison_monitor:StateComparisonMonitor
    args:
      max_points: 2000
      min_dt: 1.0
  state_metrics_mon:
    class: src.state_metrics_monitor:StateMetricsMonitor
    args:
      max_points: 2000
      min_dt: 1.0
wiring:
- from: layer_delayed_1.state
  to:
  - state_compare_mon.state_a
  - state_metrics_mon.state_a
- from: layer_delayed_2.state
  to:
  - state_compare_mon.state_b
  - state_metrics_mon.state_b
