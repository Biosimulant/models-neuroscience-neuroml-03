modules:
  layer_delayed_1:
    class: src.layer_4_delayed_stuttering_bipolar_cell_3_nmlcl001089_model:Layer4DelayedStutteringBipolarCell3Nmlcl001089Model
    args:
      model_path: data/render_xml_file.nml
  layer_delayed_2:
    class: src.layer_4_delayed_stuttering_bipolar_cell_4_nmlcl001090_model:Layer4DelayedStutteringBipolarCell4Nmlcl001090Model
    args:
      model_path: data/render_xml_file.nml
  layer_delayed_3:
    class: src.layer_4_delayed_stuttering_bipolar_cell_5_nmlcl001091_model:Layer4DelayedStutteringBipolarCell5Nmlcl001091Model
    args:
      model_path: data/render_xml_file.nml
  state_compare_mon:
    class: src.state_comparison_monitor:StateComparisonMonitor
    args:
      max_points: 2000
      min_dt: 1.0
  state_metrics_mon:
    class: src.state_metrics_monitor:StateMetricsMonitor
    args:
      max_points: 2000
      min_dt: 1.0
wiring:
- from: layer_delayed_1.state
  to:
  - state_compare_mon.state_a
  - state_metrics_mon.state_a
- from: layer_delayed_2.state
  to:
  - state_compare_mon.state_b
  - state_metrics_mon.state_b
- from: layer_delayed_3.state
  to:
  - state_compare_mon.state_c
  - state_metrics_mon.state_c
