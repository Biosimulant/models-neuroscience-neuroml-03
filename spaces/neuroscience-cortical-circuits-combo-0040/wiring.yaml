modules:
  layer_burst_1:
    class: src.layer_5_burst_non_accommodating_small_basket_cel_nmlcl000375_model:Layer5BurstNonAccommodatingSmallBasketCelNmlcl000375Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_2:
    class: src.layer_5_burst_non_accommodating_small_basket_cel_nmlcl000376_model:Layer5BurstNonAccommodatingSmallBasketCelNmlcl000376Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_3:
    class: src.layer_5_burst_stuttering_double_bouquet_cell_1_nmlcl000417_model:Layer5BurstStutteringDoubleBouquetCell1Nmlcl000417Model
    args:
      model_path: data/render_xml_file.nml
  state_compare_mon:
    class: src.state_comparison_monitor:StateComparisonMonitor
    args:
      max_points: 2000
      min_dt: 1.0
  state_metrics_mon:
    class: src.state_metrics_monitor:StateMetricsMonitor
    args:
      max_points: 2000
      min_dt: 1.0
wiring:
- from: layer_burst_1.state
  to:
  - state_compare_mon.state_a
  - state_metrics_mon.state_a
- from: layer_burst_2.state
  to:
  - state_compare_mon.state_b
  - state_metrics_mon.state_b
- from: layer_burst_3.state
  to:
  - state_compare_mon.state_c
  - state_metrics_mon.state_c
