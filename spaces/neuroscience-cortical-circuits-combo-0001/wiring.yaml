modules:
  layer_delayed_1:
    class: src.layer_4_delayed_non_accommodating_nest_basket_ce_nmlcl001044_model:Layer4DelayedNonAccommodatingNestBasketCeNmlcl001044Model
    args:
      model_path: data/render_xml_file.nml
  layer_delayed_2:
    class: src.layer_4_delayed_non_accommodating_nest_basket_ce_nmlcl001045_model:Layer4DelayedNonAccommodatingNestBasketCeNmlcl001045Model
    args:
      model_path: data/render_xml_file.nml
  state_compare_mon:
    class: src.state_comparison_monitor:StateComparisonMonitor
    args:
      max_points: 2000
      min_dt: 1.0
  state_metrics_mon:
    class: src.state_metrics_monitor:StateMetricsMonitor
    args:
      max_points: 2000
      min_dt: 1.0
wiring:
- from: layer_delayed_1.state
  to:
  - state_compare_mon.state_a
  - state_metrics_mon.state_a
- from: layer_delayed_2.state
  to:
  - state_compare_mon.state_b
  - state_metrics_mon.state_b
