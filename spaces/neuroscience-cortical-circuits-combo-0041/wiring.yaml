modules:
  layer_burst_1:
    class: src.layer_5_burst_stuttering_double_bouquet_cell_2_nmlcl000418_model:Layer5BurstStutteringDoubleBouquetCell2Nmlcl000418Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_2:
    class: src.layer_5_burst_stuttering_double_bouquet_cell_3_nmlcl000419_model:Layer5BurstStutteringDoubleBouquetCell3Nmlcl000419Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_3:
    class: src.layer_5_burst_stuttering_double_bouquet_cell_4_nmlcl000420_model:Layer5BurstStutteringDoubleBouquetCell4Nmlcl000420Model
    args:
      model_path: data/render_xml_file.nml
  state_compare_mon:
    class: src.state_comparison_monitor:StateComparisonMonitor
    args:
      max_points: 2000
      min_dt: 1.0
  state_metrics_mon:
    class: src.state_metrics_monitor:StateMetricsMonitor
    args:
      max_points: 2000
      min_dt: 1.0
wiring:
- from: layer_burst_1.state
  to:
  - state_compare_mon.state_a
  - state_metrics_mon.state_a
- from: layer_burst_2.state
  to:
  - state_compare_mon.state_b
  - state_metrics_mon.state_b
- from: layer_burst_3.state
  to:
  - state_compare_mon.state_c
  - state_metrics_mon.state_c
