modules:
  layer_burst_1:
    class: src.layer_5_burst_accommodating_bipolar_cell_3_nmlcl000139_model:Layer5BurstAccommodatingBipolarCell3Nmlcl000139Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_2:
    class: src.layer_5_burst_accommodating_bipolar_cell_4_nmlcl000140_model:Layer5BurstAccommodatingBipolarCell4Nmlcl000140Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_3:
    class: src.layer_5_burst_accommodating_bipolar_cell_5_nmlcl000141_model:Layer5BurstAccommodatingBipolarCell5Nmlcl000141Model
    args:
      model_path: data/render_xml_file.nml
  layer_burst_4:
    class: src.layer_5_burst_accommodating_bitufted_cell_1_nmlcl000142_model:Layer5BurstAccommodatingBituftedCell1Nmlcl000142Model
    args:
      model_path: data/render_xml_file.nml
  state_compare_mon:
    class: src.state_comparison_monitor:StateComparisonMonitor
    args:
      max_points: 2000
      min_dt: 1.0
  state_metrics_mon:
    class: src.state_metrics_monitor:StateMetricsMonitor
    args:
      max_points: 2000
      min_dt: 1.0
wiring:
- from: layer_burst_1.state
  to:
  - state_compare_mon.state_a
  - state_metrics_mon.state_a
- from: layer_burst_2.state
  to:
  - state_compare_mon.state_b
  - state_metrics_mon.state_b
- from: layer_burst_3.state
  to:
  - state_compare_mon.state_c
  - state_metrics_mon.state_c
- from: layer_burst_4.state
  to:
  - state_compare_mon.state_d
  - state_metrics_mon.state_d
